name: Diagnose border queue upstream (read-only)
on:
  push:
    branches: [cloudflare-migration]
    paths:
      - '.github/workflows/queue-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe public upstream and existing Worker only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const probes = [
            ['comfortline live', 'https://comfortline.by/api/border-queue'],
            ['comfortline force', 'https://comfortline.by/api/border-queue?force=true'],
            ['jina old hash', 'https://r.jina.ai/https://mon.declarant.by/%23/zone'],
            ['jina direct zone', 'https://r.jina.ai/https://mon.declarant.by/zone'],
            ['official zone', 'https://mon.declarant.by/zone'],
            ['official SPA route', 'https://mon.declarant.by/#/zone'],
            ['official monitor root', 'https://mon.declarant.by/'],
          ];
          await Promise.all(probes.map(async ([name, url])=>{
            const begin=Date.now();
            try {
              const res=await fetch(url,{signal:AbortSignal.timeout(18000),
                headers:{'User-Agent':'ComfortLineQueueDiagnostics/1.0','Accept':'text/html,application/json,text/plain,*/*'},
                redirect:'follow'});
              const raw=await res.text();
              const body=raw.slice(0,1200).replace(/[^\x20-\x7E\u0400-\u052F]/g,' ');
              const info={probe:name,status:res.status,ms:Date.now()-begin,bytes:raw.length,
                type:res.headers.get('content-type'),url:res.url,
                hasRows:/tbody|Брест|Каменный Лог|Бенякони/.test(raw),
                hasQueueHeader:/Название.*Легк|По состоянию на/.test(raw),
                sample:body.slice(0,name==='jina old hash'?1800:(name.includes('live')||name.includes('force')?600:300))};
              if(name==='official zone'||name==='official monitor root'){
                info.scripts=[...raw.matchAll(/<script[^>]*src=["']([^"']+)["']/g)].slice(0,15).map(x=>x[1]);
              }
              console.log(JSON.stringify(info));
            }catch(e){console.log(JSON.stringify({probe:name,error:String(e),ms:Date.now()-begin}))}
          }));
          NODE
      - name: Inspect public Angular bundle for monitor aggregate endpoint paths
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://mon.declarant.by/';
          const html = await (await fetch(base, {signal:AbortSignal.timeout(15000)})).text();
          const script = 'main.ca44a5745a89cbe2.js';
          if(!script){ console.log("main JS not found"); process.exit(0); }
          const response = await fetch(new URL(script,base), {signal:AbortSignal.timeout(20000)});
          const js=await response.text();
          console.log(JSON.stringify({bundle:script,http:response.status,size:js.length}));
          const unique = new Set();
          const re=new RegExp('.{0,95}(?:monitoring|statistics|countCar|countTruck|zone|declarant|api).{0,105}','gi');
          for(const match of js.matchAll(re)){
            let cleaned=match[0].slice(0,210);
            if(!unique.has(cleaned)){unique.add(cleaned);if(unique.size<=70)console.log("BUNDLE "+cleaned);}
          }
          for (const term of ['tokenTest','getCheckpointStatistics','getCheckpointInfo','monitoring-new','monitoring/statistics','api.mon.declarant.by/api/','zone/summary','getAllCheckpoints','getCheckpoints','zone-statistics']) {
            let pos=-1, count=0;
            while((pos=js.indexOf(term,pos+1))>=0 && count++<3){
              const sample=js.slice(Math.max(0,pos-350), Math.min(js.length,pos+250)).replace(/[^\x20-\x7E]/g,' ');
              console.log('TARGET '+term+' '+sample);
            }
          }
          NODE

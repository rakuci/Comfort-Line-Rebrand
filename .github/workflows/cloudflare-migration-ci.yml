name: Cloudflare migration checks

on:
  push:
    branches: [cloudflare-migration]
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'artifacts/comfortline-website/**'
      - '.github/workflows/cloudflare-migration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-prerender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Cloudflare API
        run: node --test cloudflare/worker.test.mjs
      - name: Prerender website and run SEO regression checks
        run: pnpm --filter @workspace/comfortline-website build
      - name: Verify critical static files exist
        run: |
          test -s artifacts/comfortline-website/dist/public/index.html
          test -s artifacts/comfortline-website/dist/public/sitemap.xml
          test -s artifacts/comfortline-website/dist/public/robots.txt
